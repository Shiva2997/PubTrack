# Optional: run MySQL in Docker instead of installing it.  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: pubtrack
      MYSQL_USER: pubtrack
      MYSQL_PASSWORD: pubtrack123
    ports:
      - "3306:3306"
    volumes:
      - pubtrack-data:/var/lib/mysql
volumes:
  pubtrack-data:
